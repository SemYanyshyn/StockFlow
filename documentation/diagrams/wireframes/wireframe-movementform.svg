<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1140" viewBox="0 0 2000 1140" role="img" aria-labelledby="title description">
<title id="title">StockFlow — Створення накладної</title>
<desc id="description">Редагований макет StockFlow. Світла палітра; створення руху доступне лише Працівнику.</desc>
<g font-family="Arial, sans-serif">
<rect x="0" y="0" width="2000" height="1140" rx="0" fill="white" stroke="none" stroke-width="2"/>
<rect x="40" y="40" width="1920" height="1040" rx="0" fill="white" stroke="#999" stroke-width="2"/>
<rect x="40" y="40" width="1920" height="112" rx="0" fill="#f5f4f0" stroke="#999" stroke-width="2"/>
<text x="72" y="116" font-size="40" font-weight="700" fill="#29323a">StockFlow — Створення накладної</text>
<text x="1680" y="106" font-size="26" fill="#c07700">← До списку</text>
<text x="72" y="210" font-size="28" font-weight="700" fill="#29323a">Тип руху товару *</text>
<rect x="72" y="232" width="280" height="78" rx="8" fill="#fceacb" stroke="#cc7900" stroke-width="2"/><text x="102" y="280.0" font-size="26" font-weight="700" fill="#8f5300">Надходження</text>
<rect x="366" y="232" width="280" height="78" rx="8" fill="white" stroke="#999" stroke-width="2"/><text x="396" y="280.0" font-size="26" fill="#29323a">Списання</text>
<text x="780" y="210" font-size="26" font-weight="700" fill="#29323a">Номер накладної</text><rect x="780" y="232" width="320" height="78" rx="0" fill="#f2f2f0" stroke="#999" stroke-width="2"/><text x="802" y="282" font-size="27" fill="#66717b">НК-017</text>
<text x="780" y="340" font-size="22" fill="#6d747a">Автоматично · не редагується</text>
<text x="1130" y="210" font-size="26" font-weight="700" fill="#29323a">Дата *</text><rect x="1130" y="232" width="320" height="78" rx="0" fill="white" stroke="#999" stroke-width="2"/><text x="1152" y="282" font-size="27" fill="#29323a">30.10.2026</text>
<text x="1480" y="210" font-size="26" font-weight="700" fill="#29323a">Склад *</text><rect x="1480" y="232" width="370" height="78" rx="0" fill="white" stroke="#999" stroke-width="2"/><text x="1502" y="282" font-size="27" fill="#29323a">Склад №1</text><text x="1808" y="280" font-size="24" fill="#29323a">▾</text>
<text x="72" y="404" font-size="26" font-weight="700" fill="#29323a">Товар *</text><rect x="72" y="426" width="800" height="78" rx="0" fill="white" stroke="#999" stroke-width="2"/><text x="94" y="476" font-size="27" fill="#29323a">Ноутбук Lenovo IdeaPad</text><text x="830" y="474" font-size="24" fill="#29323a">▾</text>
<text x="912" y="404" font-size="26" font-weight="700" fill="#29323a">Кількість *</text><rect x="912" y="426" width="320" height="78" rx="0" fill="white" stroke="#999" stroke-width="2"/><text x="934" y="476" font-size="27" fill="#29323a">5</text>
<text x="912" y="535" font-size="23" fill="#6d747a">Одиниця виміру: шт.</text>
<text x="1272" y="404" font-size="26" font-weight="700" fill="#29323a">Постачальник (для надходження)</text><rect x="1272" y="426" width="578" height="78" rx="0" fill="white" stroke="#999" stroke-width="2"/><text x="1294" y="476" font-size="27" fill="#29323a">Оберіть постачальника</text><text x="1808" y="474" font-size="24" fill="#29323a">▾</text>
<text x="1272" y="535" font-size="23" fill="#6d747a">Обов’язковий для надходження</text>
<text x="72" y="590" font-size="26" font-weight="700" fill="#29323a">Відповідальна особа</text><rect x="72" y="612" width="820" height="78" rx="0" fill="#f2f2f0" stroke="#999" stroke-width="2"/><text x="94" y="662" font-size="27" fill="#66717b">Семен Янишин</text>
<text x="72" y="720" font-size="23" fill="#6d747a">Поточний користувач · не редагується</text>
<text x="932" y="590" font-size="26" font-weight="700" fill="#29323a">Примітка</text><rect x="932" y="612" width="918" height="78" rx="0" fill="white" stroke="#999" stroke-width="2"/><text x="954" y="662" font-size="27" fill="#29323a">Необов’язково</text>
<rect x="72" y="782" width="1778" height="100" rx="8" fill="#fffcf6" stroke="#cc7900" stroke-width="2"/>
<text x="103" y="821" font-size="25" fill="#8f5300">Для списання поле постачальника приховане; його значення очищується.</text>
<text x="103" y="858" font-size="25" fill="#8f5300">Після збереження руху залишок на вибраному складі оновлюється автоматично.</text>
<rect x="1430" y="946" width="200" height="78" rx="8" fill="white" stroke="#999" stroke-width="2"/><text x="1460" y="994.0" font-size="26" fill="#29323a">Скасувати</text>
<rect x="1650" y="946" width="200" height="78" rx="8" fill="#fceacb" stroke="#cc7900" stroke-width="2"/><text x="1680" y="994.0" font-size="26" font-weight="700" fill="#8f5300">Зберегти</text>
<text x="72" y="1115" font-size="24" font-style="italic" fill="#666">Створення руху доступне лише Працівнику.</text>
</g>
</svg>
