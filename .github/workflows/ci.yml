name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore StockFlow.sln

      - name: Build
        run: dotnet build StockFlow.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/StockFlow.Tests/StockFlow.Tests.csproj -c Release --no-build --no-restore